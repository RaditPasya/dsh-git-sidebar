name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Actions are pinned to the commit SHA behind their v4 tag. Mutable tags
      # can be repointed upstream, which matters on a job holding id-token:write
      # for npm provenance.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: npm publish --provenance --access public
